<div class="h-full flex flex-col">
  <mat-toolbar class="z-2 flex justify-between">
    <h1 class="ml-2">Weight Tracker</h1>
    <button matIconButton><mat-icon>account_circle</mat-icon></button>
  </mat-toolbar>

  @if (isMobile()) {
    <mat-tab-group headerPosition="below">
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="flex flex-col items-center justify-center gap-1">
            <mat-icon>home</mat-icon>
            <span>Home</span>
          </div>
        </ng-template>
        <app-progress-bar-card [progress]="75" />

        <app-overview-card />

        <app-add-weight-button />
      </mat-tab>
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="flex flex-col items-center justify-center gap-1">
            <mat-icon>history</mat-icon>
            <span>History</span>
          </div>
        </ng-template>
        <app-history-list />
      </mat-tab>
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="flex flex-col items-center justify-center gap-1">
            <mat-icon>settings</mat-icon>
            <span>Settings</span>
          </div>
        </ng-template>
        <div class="p-4">
          <p class="text-xl font-medium text-gray-600">Settings</p>
        </div>
      </mat-tab></mat-tab-group
    >
  } @else {
    <mat-grid-list cols="3" rowHeight="50%" gutterSize="0">
      <mat-grid-tile [rowspan]="2">
        <div class="bg-amber-300 w-full h-full">
          <app-progress-bar-card [progress]="75" />
          <app-overview-card />
          <app-add-weight-button />
        </div>
      </mat-grid-tile>
      <mat-grid-tile [colspan]="2">
        <div class="w-full h-full bg-amber-200">
          <app-history-list />
        </div>
      </mat-grid-tile>
      <mat-grid-tile [colspan]="2">
        <div class="w-full h-full bg-amber-400">CHART</div>
      </mat-grid-tile>
    </mat-grid-list>
  }
</div>
