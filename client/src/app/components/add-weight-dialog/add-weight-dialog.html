<h2 mat-dialog-title>Add Weight</h2>
<mat-dialog-content>
  <ol>
    <li>
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="p-2">
        <mat-label>Weight</mat-label>
        <input matInput [(ngModel)]="weight" />
      </mat-form-field>
    </li>
    <li>
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="p-2">
        <mat-label>Select a date</mat-label>
        <input matInput [max]="maxDate" [matDatepicker]="picker" [formControl]="date" />
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
    </li>
  </ol>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton mat-dialog-close>Cancel</button>
  <button matButton (click)="onSubmit()">Submit</button>
</mat-dialog-actions>
