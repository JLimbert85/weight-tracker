<div [formGroup]="parts" class="inline-flex items-center w-full">
  <input
    class="w-8 border-none bg-transparent p-0 text-right outline-none font-inherit focus:ring-0 [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
    formControlName="feet"
    type="number"
    placeholder="0"
    (input)="_handleInput()"
  />
  <span class="ml-0.5 mr-2 text-[0.85em] opacity-60">ft</span>

  <input
    class="w-8 border-none bg-transparent p-0 text-right outline-none font-inherit focus:ring-0 [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
    formControlName="inches"
    type="number"
    placeholder="0"
    (input)="_handleInput()"
  />
  <span class="ml-0.5 mr-2 text-[0.85em] opacity-60">in</span>
</div>
