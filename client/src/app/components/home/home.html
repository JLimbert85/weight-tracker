@if (isMobile()) {
  <mat-tab-group headerPosition="below">
    <mat-tab>
      <ng-template mat-tab-label>
        <div class="flex flex-col items-center justify-center gap-1">
          <mat-icon>home</mat-icon>
          <span>Home</span>
        </div>
      </ng-template>
      <app-progress-bar-card
        [startWeight]="weightService.startWeight()"
        [goalWeight]="weightService.goalWeight()"
        [currentWeight]="weightService.currentWeight()"
      />
      @if (weightService.goalWeight() == undefined) {
        <div class="flex items-center w-full max-w-sm mx-auto mt-4">
          <button matButton="filled" class="w-full">
            <div class="text-xl">Set Goal Weight</div>
          </button>
        </div>
      }

      <app-overview-card
        [lossTarget]="weightService.lossTarget()"
        [lostSoFar]="weightService.lostSoFar()"
        [leftToLose]="weightService.leftToLose()"
        [startDate]="weightService.startDate()"
      />

      <app-add-weight-button />
    </mat-tab>
    <mat-tab>
      <ng-template mat-tab-label>
        <div class="flex flex-col items-center justify-center gap-1">
          <mat-icon>history</mat-icon>
          <span>History</span>
        </div>
      </ng-template>
      <app-history-list [weights]="weightService.weights()" />
    </mat-tab>
    <mat-tab>
      <ng-template mat-tab-label>
        <div class="flex flex-col items-center justify-center gap-1">
          <mat-icon>settings</mat-icon>
          <span>Settings</span>
        </div>
      </ng-template>
      <div class="p-4">
        <p class="text-xl font-medium text-gray-600">Settings</p>
      </div>
    </mat-tab></mat-tab-group
  >
} @else {
  <mat-grid-list cols="3" rowHeight="50%" gutterSize="0">
    <mat-grid-tile [rowspan]="2">
      <div class="bg-amber-300 w-full h-full">
        <app-progress-bar-card
          [startWeight]="weightService.startWeight()"
          [goalWeight]="weightService.goalWeight()"
          [currentWeight]="weightService.currentWeight()"
        />
        @if (weightService.goalWeight() == undefined) {
          <div class="flex items-center w-full max-w-sm mx-auto mt-4">
            <button matButton="filled" class="w-full">
              <div class="text-xl">Set Goal Weight</div>
            </button>
          </div>
        }
        <app-overview-card
          [lossTarget]="weightService.lossTarget()"
          [lostSoFar]="weightService.lostSoFar()"
          [leftToLose]="weightService.leftToLose()"
          [startDate]="weightService.startDate()"
        />
        <app-add-weight-button />
      </div>
    </mat-grid-tile>
    <mat-grid-tile [colspan]="2">
      <div class="w-full h-full bg-amber-200">
        <app-history-list [weights]="weightService.weights()" />
      </div>
    </mat-grid-tile>
    <mat-grid-tile [colspan]="2">
      <div class="h-full w-full p-4 bg-amber-400">
        <app-history-chart />
      </div>
    </mat-grid-tile>
  </mat-grid-list>
}
