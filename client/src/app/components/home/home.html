@if (isMobile()) {
  <mat-tab-group headerPosition="below">
    <mat-tab>
      <ng-template mat-tab-label>
        <div class="flex flex-col items-center justify-center gap-1">
          <mat-icon>home</mat-icon>
          <span>Home</span>
        </div>
      </ng-template>
      <app-progress-bar-card
        [startWeight]="weightService.startWeight()"
        [goalWeight]="weightService.goalWeight()"
        [currentWeight]="weightService.currentWeight()"
      />
      <app-overview-card
        [lossTarget]="weightService.lossTarget()"
        [lostSoFar]="weightService.lostSoFar()"
        [leftToLose]="weightService.leftToLose()"
        [startDate]="weightService.startDate()"
        [heightInInches]="weightService.heightInInches()"
        [BMI]="weightService.BMI()"
      />
      <app-add-weight-button />
    </mat-tab>
    <mat-tab>
      <ng-template mat-tab-label>
        <div class="flex flex-col items-center justify-center gap-1">
          <mat-icon>history</mat-icon>
          <span>History</span>
        </div>
      </ng-template>
      <div class="w-full h-full flex flex-col">
        <div class="w-full h-[35%] p-4">
          <app-history-chart />
        </div>
        <div class="flex-1 min-h-0 w-full overflow-y-scroll pb-2">
          <app-history-list [weights]="weightService.weights()" />
        </div>
      </div> </mat-tab
  ></mat-tab-group>
} @else {
  <mat-grid-list cols="3" rowHeight="50%" gutterSize="0">
    <mat-grid-tile [rowspan]="2">
      <div class="w-full h-full">
        <app-progress-bar-card
          [startWeight]="weightService.startWeight()"
          [goalWeight]="weightService.goalWeight()"
          [currentWeight]="weightService.currentWeight()"
        />
        <app-overview-card
          [lossTarget]="weightService.lossTarget()"
          [lostSoFar]="weightService.lostSoFar()"
          [leftToLose]="weightService.leftToLose()"
          [startDate]="weightService.startDate()"
          [heightInInches]="weightService.heightInInches()"
          [BMI]="weightService.BMI()"
        />
        <app-add-weight-button />
      </div>
    </mat-grid-tile>
    <mat-grid-tile [colspan]="2">
      <div class="h-full w-full p-4">
        <app-history-chart />
      </div>
    </mat-grid-tile>
    <mat-grid-tile [colspan]="2">
      <div class="w-full h-full overflow-y-scroll pb-2">
        <app-history-list [weights]="weightService.weights()" />
      </div>
    </mat-grid-tile>
  </mat-grid-list>
}
