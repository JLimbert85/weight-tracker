<div>
  <mat-card class="flex items-center w-full h-full max-w-sm mx-auto mt-10">
    <mat-card-header>
      <mat-card-title>Login</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (formError) {
        <mat-error>
          {{ formError }}
        </mat-error>
      }
      <ol>
        <li>
          <mat-form-field appearance="outline" subscriptSizing="dynamic" class="p-2">
            <mat-label>Email</mat-label>
            <input matInput type="email" [(ngModel)]="credentials.email" />
          </mat-form-field>
        </li>
        <li>
          <mat-form-field appearance="outline" subscriptSizing="dynamic" class="p-2">
            <mat-label>Password</mat-label>
            <input matInput type="password" [(ngModel)]="credentials.password" />
          </mat-form-field>
        </li>
      </ol>
    </mat-card-content>
    <mat-card-actions align="end">
      <button matButton (click)="onLoginSubmit()">Submit</button>
    </mat-card-actions>
  </mat-card>
</div>
