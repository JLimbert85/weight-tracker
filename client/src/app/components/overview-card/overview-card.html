<mat-card class="flex items-center w-full max-w-sm min-w-sm mx-auto mt-4">
  <mat-card-content class="w-full">
    <div class="text-xl font-medium text-gray-600 flex flex-col w-full gap-2">
      <div class="flex flex-row px-4 justify-between">
        <div>Weight Loss Target:</div>
        <div>{{ lossTargetText() }}</div>
      </div>
      <div class="flex flex-row px-4 justify-between">
        <div>Weight Loss So Far:</div>
        <div>{{ lostSoFarText() }}</div>
      </div>
      <div class="flex flex-row px-4 justify-between">
        <div>Weight Left To Lose:</div>
        <div>{{ leftToLoseText() }}</div>
      </div>
      <div class="flex flex-row px-4 justify-between">
        <div>Start Date:</div>
        <div>{{ startDateText() }}</div>
      </div>
      <div class="flex flex-row px-4 justify-between">
        <div>Height:</div>
        <div>{{ heightInInchesText() }}</div>
      </div>
      <div class="flex flex-row px-4 justify-between">
        <div>BMI:</div>
        <div>{{ BMIText() }}</div>
      </div>
    </div>
  </mat-card-content>
</mat-card>
