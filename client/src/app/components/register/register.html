<form (ngSubmit)="onRegisterSubmit()">
  <mat-card class="flex items-center w-full h-full max-w-sm mx-auto mt-10">
    <mat-card-header>
      <mat-card-title>Register</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (formError()) {
        <mat-error class="text-center">
          {{ formError() }}
        </mat-error>
      }
      <ol>
        <li>
          <mat-form-field appearance="outline" subscriptSizing="dynamic" class="p-2">
            <mat-label>Email</mat-label>
            <input matInput type="email" [(ngModel)]="credentials.email" name="email" />
          </mat-form-field>
        </li>
        <li>
          <mat-form-field appearance="outline" subscriptSizing="dynamic" class="p-2">
            <mat-label>Password</mat-label>
            <input matInput type="password" [(ngModel)]="credentials.password" name="password" />
          </mat-form-field>
        </li>
        <li>
          <mat-form-field appearance="outline" subscriptSizing="dynamic" class="p-2">
            <mat-label>Confirm Password</mat-label>
            <input
              matInput
              type="password"
              [(ngModel)]="credentials.confirmPassword"
              name="confirmPassword"
            />
          </mat-form-field>
        </li>
        <li>
          <mat-card-subtitle class="pt-4 pb-2 text-center">
            <p>Enter starting measurements</p>
            <p class="text-sm text-gray-500">(This can be changed later)</p>
          </mat-card-subtitle>
          <mat-form-field
            appearance="outline"
            floatLabel="always"
            subscriptSizing="dynamic"
            class="p-2"
          >
            <mat-label>Height</mat-label>
            <app-height-input [(ngModel)]="height" name="height" #heightInput="ngModel">
            </app-height-input>
          </mat-form-field>
        </li>
        <li>
          <mat-form-field appearance="outline" subscriptSizing="dynamic" class="p-2">
            <mat-label>Goal Weight</mat-label>
            <input matInput type="number" [(ngModel)]="credentials.goalWeight" name="goalWeight" />
          </mat-form-field>
        </li>
      </ol>
    </mat-card-content>
    <mat-card-actions>
      <div class="flex flex-col gap-4">
        <a class="text-blue-500 hover:text-blue-700" [routerLink]="['/login']"
          >Already have an account? Login</a
        >
        <button matButton="filled" type="submit" [showProgress]="showSpinner()">
          Submit
          <mat-progress-spinner
            progressIndicator
            mode="indeterminate"
            diameter="20"
            aria-label="Loading"
            tabindex=""
          />
        </button>
      </div>
    </mat-card-actions>
  </mat-card>
</form>
